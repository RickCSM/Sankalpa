# Serves the built SPA and reverse-proxies /api to the API container.
#
# TLS is terminated here. The app sets session cookies as `secure` in
# production, so the browser MUST reach the app over HTTPS or logins silently
# fail. We forward X-Forwarded-Proto: https to the API (which trusts one proxy
# hop) so it marks requests secure and issues the cookie.
#
# If an external load balancer already terminates TLS, you can instead serve
# the app on the plain :80 server block below — but that block must still
# receive X-Forwarded-Proto: https from the upstream LB.

upstream sankalpa_api {
    server api:5000;
}

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Attachments are capped at 10 MB by the API; allow a little overhead.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # All API + file traffic lives under /api. Preserve the /api prefix.
    location /api/ {
        proxy_pass http://sankalpa_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
