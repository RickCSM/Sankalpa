# Full Sankalpa Odisha stack: Postgres + API + web (nginx).
# Deploy / redeploy:  docker compose up -d --build
#
# All configuration comes from the server-only .env file (never committed).
# Run ./deploy/gen-secrets.sh once on a new server to create it.
#
# The project name and volume names are pinned below so the database/uploads
# volumes resolve to the SAME names regardless of the folder this is cloned into
# — existing servers reuse their data on upgrade, with no dependency on the
# clone directory being called `sankalpa`.
name: sankalpa

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sankalpa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run ./deploy/gen-secrets.sh}
      POSTGRES_DB: ${POSTGRES_DB:-sankalpa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sankalpa} -d ${POSTGRES_DB:-sankalpa}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgres://${POSTGRES_USER:-sankalpa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sankalpa}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required — run ./deploy/gen-secrets.sh}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-8}
      # --- Object storage backend ---------------------------------------------
      # By default the API stores uploads on the local-disk `uploads` volume
      # below. To keep photos/attachments durable on object storage, point the
      # API at an S3-compatible service (e.g. MinIO, AWS S3, Backblaze B2) by
      # setting the S3_* vars in your .env and uncommenting the block below.
      # When S3_BUCKET + S3_ACCESS_KEY_ID + S3_SECRET_ACCESS_KEY are all set the
      # S3 backend is auto-selected; otherwise it falls back to local disk.
      UPLOAD_DIR: /app/uploads
      # STORAGE_BACKEND: ${STORAGE_BACKEND:-}        # local | s3 | replit (auto-detect if empty)
      # S3_BUCKET: ${S3_BUCKET}
      # S3_ENDPOINT: ${S3_ENDPOINT}                   # e.g. https://minio.example.com (required for MinIO)
      # S3_REGION: ${S3_REGION:-us-east-1}
      # S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      # S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      # S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}   # keep true for MinIO
      # S3_PREFIX: ${S3_PREFIX:-}                     # optional key prefix, e.g. sankalpa/
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro

volumes:
  # Pinned names so the volumes are stable across upgrades and independent of the
  # compose project / clone-folder name. `sankalpa_pgdata` matches what both the
  # old single-stack and the (reverted) separate-db stack used, so existing data
  # is reused automatically.
  pgdata:
    name: sankalpa_pgdata
  uploads:
    name: sankalpa_uploads
