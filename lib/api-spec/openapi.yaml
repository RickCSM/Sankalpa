openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sankalpa Odisha API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: master-data
    description: Departments, categories, tags
  - name: uoi-notes
    description: UOI Notes management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check (server liveness)
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: deepHealthCheck
      tags: [health]
      summary: Deep health check (DB ping)
      responses:
        "200": { description: Healthy, content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } } }
        "503": { description: Unhealthy, content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } } }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RequestUploadUrlBody" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RequestUploadUrlResponse" } } } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /announcements/{id}/attachments:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Announcements]
      operationId: listAnnouncementAttachments
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AttachmentListResponse" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [Announcements]
      operationId: registerAnnouncementAttachment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RegisterAttachmentRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AttachmentResponse" } } } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /attachments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    delete:
      tags: [Announcements]
      operationId: deleteAttachment
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /storage/uoi-notes/uploads/request-url:
    post:
      operationId: requestUoiNoteUploadUrl
      tags: [storage]
      summary: Request an upload URL for a UOI note attachment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RequestUoiNoteUploadUrlBody" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RequestUploadUrlResponse" } } } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /uoi-notes/{id}/attachments:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [UoiNotes]
      operationId: listUoiNoteAttachments
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UoiNoteAttachmentListResponse" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [UoiNotes]
      operationId: registerUoiNoteAttachment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RegisterAttachmentRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/UoiNoteAttachmentResponse" } } } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /uoi-note-attachments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    delete:
      tags: [UoiNotes]
      operationId: deleteUoiNoteAttachment
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /audit-log:
    get:
      tags: [admin]
      operationId: listAuditLog
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: pageSize
          schema: { type: integer }
        - in: query
          name: actorId
          schema: { type: integer }
        - in: query
          name: actorRole
          schema: { type: string }
          description: Filter by the actor's role at the time of the action (e.g. admin, cmo_nodal, anonymous).
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: targetTable
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: sortBy
          schema: { type: string }
          description: Column key to sort by (createdAt, actorName, actorRole, action, targetTable, route, id)
        - in: query
          name: sortDir
          schema: { type: string, enum: [asc, desc] }
          description: Sort direction
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditLogListResponse" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangePasswordRequest" } } }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /auth/profile-photo/upload-url:
    post:
      operationId: requestProfilePhotoUploadUrl
      tags: [auth]
      summary: Request a one-time upload URL for the current user's profile photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePhotoUploadUrlRequest"
      responses:
        "200":
          description: Upload URL granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePhotoUploadUrlResponse"
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }

  /auth/profile-photo:
    put:
      operationId: setProfilePhoto
      tags: [auth]
      summary: Finalize and set the current user's profile photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetProfilePhotoRequest"
      responses:
        "200":
          description: Photo set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: removeProfilePhoto
      tags: [auth]
      summary: Remove the current user's profile photo
      responses:
        "200":
          description: Photo removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401": { $ref: "#/components/responses/ErrorResponse" }

  /me/preferences:
    get:
      operationId: getMyPreferences
      tags: [users]
      summary: Get the current user's UI preferences
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: updateMyPreferences
      tags: [users]
      summary: Update the current user's UI preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferences"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (scoped by RBAC)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /users/{id}/reset-password:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Admin-only — reset another user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetUserPasswordRequest"
      responses:
        "200":
          description: New password (shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetUserPasswordResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /users/{id}/workload:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: getUserWorkload
      tags: [users]
      summary: Pending assigned activities and eligible reassignment targets for a user
      responses:
        "200":
          description: Workload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWorkloadResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /users/{id}/reassign-activities:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: reassignUserActivities
      tags: [users]
      summary: Reassign a user's pending sub-components to other users before removal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignActivitiesRequest"
      responses:
        "204":
          description: Reassigned
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /directory:
    get:
      operationId: listDirectory
      tags: [users]
      summary: Minimal user directory available to every authenticated role
      responses:
        "200":
          description: Directory entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryListResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }

  /departments:
    get:
      operationId: listDepartments
      tags: [master-data]
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepartmentListResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: createDepartment
      tags: [master-data]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
      responses:
        "200":
          description: Existing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepartmentResponse" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepartmentResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /departments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      operationId: updateDepartment
      tags: [master-data]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepartmentResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: deleteDepartment
      tags: [master-data]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }

  /categories:
    get:
      operationId: listCategories
      tags: [master-data]
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryListResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: createCategory
      tags: [master-data]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
      responses:
        "200":
          description: Existing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryResponse" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /categories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      operationId: updateCategory
      tags: [master-data]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: deleteCategory
      tags: [master-data]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }

  /tags:
    get:
      operationId: listTags
      tags: [master-data]
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagListResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: createTag
      tags: [master-data]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
      responses:
        "200":
          description: Existing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagResponse" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /tags/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      operationId: updateTag
      tags: [master-data]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: deleteTag
      tags: [master-data]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }

  /districts:
    get:
      operationId: listDistricts
      tags: [master-data]
      responses:
        "200":
          description: Districts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistrictListResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: createDistrict
      tags: [master-data]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
      responses:
        "200":
          description: Existing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistrictResponse" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistrictResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /districts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      operationId: updateDistrict
      tags: [master-data]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistrictResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: deleteDistrict
      tags: [master-data]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }

  /blocks:
    get:
      operationId: listBlocks
      tags: [master-data]
      parameters:
        - in: query
          name: districtId
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Blocks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockListResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: createBlock
      tags: [master-data]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockCreateRequest" }
      responses:
        "200":
          description: Existing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockResponse" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockResponse" }
